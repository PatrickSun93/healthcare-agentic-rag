name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Real Postgres + pgvector for tests/test_pgvector.py (ingest -> retrieve -> eval on the pgvector
    # backend). Embeddings use EMBED_PROVIDER=hash inside the tests, so no Ollama is needed here; the
    # full eval against real models is a local step (see README "Evals").
    services:
      pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: healthcare_rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d healthcare_rag"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      PGVECTOR_URL: postgresql://postgres:postgres@localhost:5432/healthcare_rag

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test (unit + pgvector integration)
        run: pytest -v
