services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # REST + client
      - "6334:6334"   # gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage

  # Postgres + pgvector (VECTOR_BACKEND=pgvector). Named volume: Postgres is picky about
  # bind-mount ownership on macOS/Windows, so unlike qdrant_storage this is not a ./ folder.
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: healthcare_rag
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d healthcare_rag"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgvector_data:
